name: ROS Noetic CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ros:noetic-ros-base-focal
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake ffmpeg libavcodec-dev libavutil-dev libswscale-dev \
            libopencv-dev pkg-config ros-noetic-camera-info-manager ros-noetic-cv-bridge \
            ros-noetic-image-transport ros-noetic-image-view ros-noetic-sensor-msgs \
            ros-noetic-std-msgs ros-noetic-std-srvs
      - name: Build
        shell: bash
        run: |
          source /opt/ros/noetic/setup.bash
          mkdir -p /tmp/smartcar_ws/src
          ln -s "$GITHUB_WORKSPACE/ros_ws/src/usb_cam" /tmp/smartcar_ws/src/usb_cam
          cd /tmp/smartcar_ws
          catkin_make -DCMAKE_BUILD_TYPE=Release
      - name: Parse launch files
        shell: bash
        run: |
          source /opt/ros/noetic/setup.bash
          source /tmp/smartcar_ws/devel/setup.bash
          roslaunch --nodes usb_cam smartcar.launch
